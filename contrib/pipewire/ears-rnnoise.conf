# ears: denoised copy of a microphone for voice activity detection.
# RNNoise (extra/noise-suppression-for-voice) with its own VAD gate off
# (threshold 0): it only removes noise; ears decides what is speech.
# Select it with `ears select` or `device = "ears_denoised_mic"` in
# ~/.config/ears/config.toml. Remove this file and restart
# filter-chain.service to undo.
context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Ears denoised mic (RNNoise)"
        media.name = "Ears denoised mic (RNNoise)"
        filter.graph = {
            nodes = [
                {
                    type = ladspa
                    name = rnnoise
                    plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                    label = noise_suppressor_mono
                    control = {
                        "VAD Threshold (%)" = 0
                        "VAD Grace Period (ms)" = 0
                        "Retroactive VAD Grace (ms)" = 0
                    }
                }
            ]
        }
        capture.props = {
            node.name = "capture.ears_denoised_mic"
            node.passive = true
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            # Your microphone (`wpctl status`, `ears list`); unset follows the default source.
            target.object = "alsa_input.YOUR-MIC"
        }
        playback.props = {
            node.name = "ears_denoised_mic"
            media.class = Audio/Source
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
        }
    }
}
]
