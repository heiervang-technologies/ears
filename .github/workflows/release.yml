name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Read version from Cargo.toml
        id: version
        run: |
          set -euo pipefail
          # Source of truth: Cargo.toml. Releases happen on intentional bumps.
          PACKAGE_ID=$(cargo pkgid)
          VERSION_NUM="${PACKAGE_ID##*#}"
          VERSION_NUM="${VERSION_NUM##*@}"
          if [[ -z "$VERSION_NUM" ]]; then
            echo "Could not parse version from Cargo.toml" >&2
            exit 1
          fi
          NEW_VERSION="v${VERSION_NUM}"
          ./scripts/check-version.sh "$NEW_VERSION"

          # Skip if a release tag for this version already exists
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "SKIP=true" >> $GITHUB_OUTPUT
            echo "Tag $NEW_VERSION already exists, skipping release"
            exit 0
          fi

          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "SKIP=false" >> $GITHUB_OUTPUT
          echo "Releasing $NEW_VERSION"

      - name: Build release
        if: steps.version.outputs.SKIP != 'true'
        run: cargo build --release --verbose

      - name: Verify binary version
        if: steps.version.outputs.SKIP != 'true'
        run: |
          expected="ears ${{ steps.version.outputs.VERSION_NUM }}"
          actual=$(target/release/ears --version)
          if [[ "$actual" != "$expected" ]]; then
            echo "Binary version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Create tarball
        if: steps.version.outputs.SKIP != 'true'
        run: |
          mkdir -p release
          cp target/release/ears release/
          cp README.md release/ 2>/dev/null || true
          cp LICENSE release/ 2>/dev/null || true
          cd release && tar -czvf ../ears-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz *

      - name: Create git tag
        if: steps.version.outputs.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

      - name: Create GitHub release
        if: steps.version.outputs.SKIP != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: |
            ears-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
            target/release/ears
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
