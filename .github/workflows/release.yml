name: Release

on:
  push:
    branches: [main]
  # Changes to the packaging build both binaries without releasing.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.SKIP }}
      version: ${{ steps.version.outputs.VERSION }}
      version_num: ${{ steps.version.outputs.VERSION_NUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read version from Cargo.toml
        id: version
        run: |
          set -euo pipefail
          # Source of truth: Cargo.toml. Releases happen on intentional bumps.
          PACKAGE_ID=$(cargo pkgid)
          VERSION_NUM="${PACKAGE_ID##*#}"
          VERSION_NUM="${VERSION_NUM##*@}"
          if [[ -z "$VERSION_NUM" ]]; then
            echo "Could not parse version from Cargo.toml" >&2
            exit 1
          fi
          NEW_VERSION="v${VERSION_NUM}"
          ./scripts/check-version.sh "$NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=$VERSION_NUM" >> $GITHUB_OUTPUT

          # Skip if a release tag for this version already exists
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "SKIP=true" >> $GITHUB_OUTPUT
            echo "Tag $NEW_VERSION already exists, skipping release"
            exit 0
          fi

          echo "SKIP=false" >> $GITHUB_OUTPUT
          echo "Releasing $NEW_VERSION"

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.skip != 'true' || github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 runners: the binaries need glibc 2.35 or newer, so
          # they run on Debian 12, Ubuntu 22.04 and anything newer, not only
          # on the newest distributions. install.sh checks for the same.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Build release
        run: cargo build --release --locked --verbose

      - name: Verify binary version
        run: |
          expected="ears ${{ needs.version.outputs.version_num }}"
          actual=$(target/release/ears --version)
          if [[ "$actual" != "$expected" ]]; then
            echo "Binary version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          V=${{ needs.version.outputs.version }}
          A=${{ matrix.arch }}
          mkdir -p release dist
          cp target/release/ears README.md LICENSE release/
          # Two names for the same archive: the versioned one, and a fixed one
          # so releases/latest/download/ears-linux-$A.tar.gz always resolves.
          tar -C release -czf dist/ears-$V-linux-$A.tar.gz ears README.md LICENSE
          cp dist/ears-$V-linux-$A.tar.gz dist/ears-linux-$A.tar.gz
          cd dist
          for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          if [[ $A == x86_64 ]]; then cp ../target/release/ears ears; fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    name: Release
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.version.outputs.version }}
          git push origin ${{ needs.version.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          # `ears` is the x86_64 binary on its own, as older releases had it.
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
