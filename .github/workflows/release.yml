name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Calculate next version
        id: version
        run: |
          # Get latest version tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [[ -z "$LATEST_TAG" ]]; then
            LATEST_TAG="v0.0.0"
          fi

          # Count commits since last tag
          COMMITS_SINCE=$(git rev-list ${LATEST_TAG}..HEAD --count 2>/dev/null || echo "1")

          # If no new commits, skip release
          if [[ "$COMMITS_SINCE" == "0" ]]; then
            echo "SKIP=true" >> $GITHUB_OUTPUT
            echo "No new commits since $LATEST_TAG, skipping release"
            exit 0
          fi

          # Extract version parts and bump patch
          BASE_VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $BASE_VERSION | cut -d. -f1)
          MINOR=$(echo $BASE_VERSION | cut -d. -f2)
          PATCH=$(echo $BASE_VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + COMMITS_SINCE))

          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
          echo "SKIP=false" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update Cargo.toml version
        if: steps.version.outputs.SKIP != 'true'
        run: |
          VERSION_NUM=${{ steps.version.outputs.VERSION_NUM }}
          sed -i "0,/^version = .*/s//version = \"${VERSION_NUM}\"/" Cargo.toml
          echo "Updated Cargo.toml to version ${VERSION_NUM}"

      - name: Build release
        if: steps.version.outputs.SKIP != 'true'
        run: cargo build --release --verbose

      - name: Create tarball
        if: steps.version.outputs.SKIP != 'true'
        run: |
          mkdir -p release
          cp target/release/ears release/
          cp README.md release/ 2>/dev/null || true
          cp LICENSE release/ 2>/dev/null || true
          cd release && tar -czvf ../ears-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz *

      - name: Create git tag
        if: steps.version.outputs.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

      - name: Create GitHub release
        if: steps.version.outputs.SKIP != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: |
            ears-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
            target/release/ears
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version to repo
        if: steps.version.outputs.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION_NUM=${{ steps.version.outputs.VERSION_NUM }}
          sed -i "0,/^version = .*/s//version = \"${VERSION_NUM}\"/" Cargo.toml
          git add Cargo.toml
          git diff --cached --quiet || git commit -m "chore: bump version to ${VERSION_NUM} [skip ci]"
          git push origin HEAD:main || true
