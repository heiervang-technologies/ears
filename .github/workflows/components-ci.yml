name: Stream components CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin:
    name: vLLM plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vllm-plugin/pyproject.toml
      - name: Install plugin test dependencies
        run: python -m pip install -e './vllm-plugin[test]'
      - name: Test protocol, sessions and engine integration
        run: python -m pytest vllm-plugin/tests -q

  addon:
    name: fcitx5 addon build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install addon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libfcitx5core-dev libfcitx5utils-dev
      - name: Configure and build addon
        run: |
          cmake -S fcitx5-addon -B build/fcitx5 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/fcitx5 --parallel 2

  workflow-lint:
    name: Agent workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate agent workflow expressions and shell scripts
        run: actionlint .github/workflows/mention-trigger.yml .github/workflows/assignment-trigger.yml
