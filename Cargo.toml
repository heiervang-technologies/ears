[package]
name = "ears"
version = "0.1.0"
edition = "2021"
authors = ["Mark Sverdhei <mark.sverdhei@heiervang.com>"]
description = "A production-grade speech recognition daemon for Linux"
license = "MIT"
repository = "https://github.com/heiervang-technologies/ears"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Configuration
url = { version = "2.5", features = ["serde"] }
directories = "5.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["multipart", "json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System interface
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
serial_test = "3.2"
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
