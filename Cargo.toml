[package]
name = "ears"
version = "1.1.73"
edition = "2021"
authors = ["Mark Sverdhei <mark.sverdhei@heiervang.com>"]
description = "A production-grade speech recognition daemon for Linux"
license = "MIT"
repository = "https://github.com/heiervang-technologies/ears"

[dependencies]
# CLI and configuration (Iteration 1)
clap = { version = "4.5", features = ["derive", "env"] }
url = { version = "2.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
directories = "5.0"

# State management and process control (Iteration 2)
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }

# HTTP client for whisper.cpp API (Iteration 4)
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
backoff = { version = "0.4", features = ["tokio"] }

# TUI framework (Iteration 7)
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3.16"
serial_test = "3.2"
tokio-test = "0.4"
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"
insta = "1.40"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
