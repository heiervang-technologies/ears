[package]
name = "ears"
version = "0.1.0"
edition = "2021"
authors = ["Mark Sverdheim <mark@heiervang.tech>"]
description = "Speech recognition daemon with TUI"
license = "MIT"
repository = "https://github.com/heiervang-technologies/ears"

[[bin]]
name = "ears"
path = "src/bin/ears.rs"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["multipart", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System interface
libc = "0.2"

[dev-dependencies]
# Testing
tempfile = "3.14"
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
