[package]
name = "ears"
version = "0.1.0"
edition = "2021"
authors = ["marksverdhai <ai@heiervang.com>"]
description = "Production-grade speech recognition daemon for Linux"
license = "MIT"

[dependencies]
# HTTP client for whisper.cpp API
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
thiserror = "2"
anyhow = "1"
# Logging
tracing = "0.1"
# Retry logic
backoff = { version = "0.4", features = ["tokio"] }

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"
wiremock = "0.6"
