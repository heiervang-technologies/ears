[package]
name = "ears"
version = "0.1.0"
edition = "2021"
authors = ["Mark Sverdhei <mark.sverdhei@heiervang.com>"]
description = "A production-grade speech recognition daemon for Linux"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
url = { version = "2.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
directories = "5.0"

[dev-dependencies]
tempfile = "3.14"
serial_test = "3.2"
